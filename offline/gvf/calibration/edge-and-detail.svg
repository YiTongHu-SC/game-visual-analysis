      <rect x="-42" y="-38" width="84" height="40" rx="7" fill="#9fbfc2" />
      <rect x="-23" y="-19" width="10" height="12" rx="2" fill="#263b45" stroke="none" />
      <rect x="-6" y="-29" width="10" height="22" rx="2" fill="#263b45" stroke="none" />
      <rect x="11" y="-23" width="10" height="16" rx="2" fill="#263b45" stroke="none" />
      <circle cx="-28" cy="54" r="4" fill="#6b8580" stroke="none" />
      <circle cx="0" cy="54" r="4" fill="#6b8580" stroke="none" />
      <circle cx="28" cy="54" r="4" fill="#6b8580" stroke="none" />
    </g>
    <text x="220" y="345" font-size="15" font-weight="400" fill="#566b70" text-anchor="middle">边界转换集中；内部图形保持清晰。</text>
  </g>
