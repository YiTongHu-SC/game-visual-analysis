<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="atlas-title atlas-desc" lang="zh-CN" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', sans-serif">
  <title id="atlas-title">边缘与表面信息：两组独立对照</title>
  <desc id="atlas-desc">同一原创回收扫描器，上排演示硬边、软边和主壳不规则边；下排演示6、20、60个同类表面标记。两排不构成好坏排序，也不表示完整游戏画风。</desc>
  <rect width="1200" height="700" fill="#f4f6f2" />
  <text x="40" y="44" font-size="28" font-weight="700" fill="#263b45" text-anchor="start">边缘与表面信息：两组独立对照</text>
  <text x="40" y="76" font-size="16" font-weight="400" fill="#263b45" text-anchor="start">基准画布 1200 × 700；两排分别观察边界与表面信息；所有对象保持同一比例与色板。</text>
  <defs>
    <filter id="soft-edge" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.8" />
    </filter>
  </defs>
  <g data-panel="hard-edge">
    <rect x="40" y="100" width="360" height="260" rx="16" fill="#ffffff" stroke="#d7e0db" />
    <text x="60" y="129" font-size="22" font-weight="700" fill="#263b45" text-anchor="start">硬边</text>
    <g transform="translate(220 231)" data-role="tool" data-outline-width="0" stroke="#263b45" stroke-width="0" stroke-linejoin="round" stroke-linecap="round">
